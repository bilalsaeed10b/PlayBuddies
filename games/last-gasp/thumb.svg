<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#131c2e"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <circle cx="66" cy="34" r="52" fill="#94a3b8" opacity="0.08"/>
  <circle cx="266" cy="176" r="60" fill="#84cc16" opacity="0.10"/>

  <!-- the frame, faint -->
  <g stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 34 168 L 86 168"/>
    <path d="M 60 168 L 60 34"/>
    <path d="M 60 34 L 122 34"/>
    <path d="M 60 54 L 80 34"/>
  </g>
  <!-- seven of eight lines: one left -->
  <g stroke="#f8fafc" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 122 34 L 122 56"/>
    <circle cx="122" cy="70" r="14"/>
    <path d="M 122 84 L 122 126"/>
    <path d="M 122 94 L 100 114"/>
    <path d="M 122 94 L 144 114"/>
    <path d="M 122 126 L 104 158"/>
    <path d="M 122 126 L 140 158"/>
  </g>

  <!-- the word, mostly blank -->
  <g fill="#f8fafc" font-family="system-ui,sans-serif" font-size="26" font-weight="900" text-anchor="middle">
    <text x="188" y="96">G</text>
    <text x="252" y="96">S</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="4" stroke-linecap="round">
    <path d="M 176 104 L 200 104"/><path d="M 208 104 L 232 104"/>
    <path d="M 240 104 L 264 104"/><path d="M 272 104 L 296 104"/>
  </g>

  <text x="188" y="150" fill="#a3e635" font-family="system-ui,sans-serif" font-size="15"
        font-weight="900" letter-spacing="3">ONE LINE LEFT</text>
  <text x="188" y="172" fill="#64748b" font-family="system-ui,sans-serif" font-size="12"
        font-weight="700" letter-spacing="1">DON'T BE THE ONE WHO DRAWS IT</text>
</svg>
