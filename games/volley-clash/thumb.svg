<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Vector rather than a screenshot: it stays sharp at every card size the
    catalog renders, and it is 2 KB instead of the 300 KB a WebP of the same
    scene would cost. The palette is the baked court's, so the card and the
    game look like the same product.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3f75"/>
      <stop offset="0.42" stop-color="#2f8fd0"/>
      <stop offset="0.72" stop-color="#7fd0f0"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e6ba8"/>
      <stop offset="1" stop-color="#28a8d8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5dcae"/>
      <stop offset="1" stop-color="#c9a068"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f6e7c8"/>
      <stop offset="1" stop-color="#c9a86f"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffecaa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffc878" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="356" cy="196" r="150" fill="url(#glow)"/>
  <circle cx="356" cy="196" r="38" fill="#fff7d6" opacity="0.95"/>

  <!-- headland -->
  <path d="M-10 260 L60 224 L128 246 L196 210 L276 240 L352 214 L432 244 L522 222 L522 268 L-10 268 Z"
        fill="#103e5c" opacity="0.55"/>

  <!-- sea -->
  <rect x="0" y="262" width="512" height="120" fill="url(#sea)"/>
  <g fill="#ffffff" opacity="0.35">
    <rect x="60" y="292" width="46" height="3"/><rect x="180" y="312" width="70" height="3"/>
    <rect x="300" y="284" width="58" height="3"/><rect x="386" y="330" width="82" height="3"/>
    <rect x="120" y="350" width="54" height="3"/><rect x="268" y="344" width="66" height="3"/>
  </g>

  <!-- sand -->
  <rect x="0" y="378" width="512" height="134" fill="url(#sand)"/>
  <rect x="0" y="375" width="512" height="5" fill="#ffffff" opacity="0.4"/>

  <!-- net -->
  <rect x="248" y="252" width="14" height="140" fill="#e2e8f0"/>
  <g stroke="#ffffff" stroke-width="1.6" opacity="0.6">
    <path d="M246 268 L264 258 M246 282 L264 272 M246 296 L264 286 M246 310 L264 300
             M246 324 L264 314 M246 338 L264 328 M246 352 L264 342 M246 366 L264 356"/>
  </g>
  <rect x="244" y="250" width="22" height="12" fill="#ffffff"/>
  <rect x="244" y="259" width="22" height="3" fill="#0f172a"/>

  <!-- left player, blaze -->
  <g transform="translate(126 372)">
    <ellipse cx="0" cy="16" rx="46" ry="10" fill="#6b4a24" opacity="0.28"/>
    <circle cx="0" cy="-22" r="48" fill="#f97316"/>
    <path d="M-42 -22 A42 42 0 0 1 42 -22 L42 4 Q0 22 -42 4 Z" fill="#f43f5e"/>
    <path d="M-42 -22 A42 42 0 0 1 42 -22" fill="none" stroke="#881337" stroke-width="4"/>
    <circle cx="15" cy="-31" r="7" fill="#fff"/><circle cx="18" cy="-31" r="3.4" fill="#0f172a"/>
    <path d="M-22 -52 Q-36 -76 -16 -72 Q-22 -62 -22 -52 Z" fill="#881337"/>
    <path d="M22 -52 Q36 -76 16 -72 Q22 -62 22 -52 Z" fill="#881337"/>
  </g>

  <!-- right player, tide -->
  <g transform="translate(388 372) scale(-1 1)">
    <ellipse cx="0" cy="16" rx="46" ry="10" fill="#6b4a24" opacity="0.28"/>
    <circle cx="0" cy="-22" r="48" fill="#0ea5e9"/>
    <path d="M-42 -22 A42 42 0 0 1 42 -22 L42 4 Q0 22 -42 4 Z" fill="#38bdf8"/>
    <path d="M-42 -22 A42 42 0 0 1 42 -22" fill="none" stroke="#075985" stroke-width="4"/>
    <circle cx="15" cy="-31" r="7" fill="#fff"/><circle cx="18" cy="-31" r="3.4" fill="#0f172a"/>
    <path d="M-34 -46 A38 38 0 0 1 34 -46 L34 -38 A38 38 0 0 0 -34 -38 Z" fill="#075985"/>
  </g>

  <!-- the ball, mid-spike, with a motion trail -->
  <path d="M196 132 Q236 152 268 178" stroke="#ffeebe" stroke-width="22" stroke-linecap="round"
        fill="none" opacity="0.4"/>
  <g transform="translate(282 192) rotate(18)">
    <circle r="42" fill="url(#ball)"/>
    <g fill="none" stroke="#e0563a" stroke-width="5">
      <ellipse rx="39" ry="14"/>
      <ellipse rx="39" ry="14" transform="rotate(60)"/>
      <ellipse rx="39" ry="14" transform="rotate(120)"/>
    </g>
  </g>
</svg>
